name: Publish Craboo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage website
        run: |
          mkdir dist
          cp index.html style.css leg-demo.html .nojekyll dist/
          cp -R assets src vendor dist/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published pages
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "${{ steps.deployment.outputs.page_url }}" | grep -q 'src/site-layout.js'
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "${{ steps.deployment.outputs.page_url }}src/assembly.js" | grep -q 'assembly-guide'
